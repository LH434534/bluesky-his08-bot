name: diag-bot
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    if: github.actor == 'LH434534'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: pip install -U g4f pillow --quiet || true
      - name: Rodar tick com captura (diag)
        env:
          TZ: "America/Sao_Paulo"
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_DIAG_NOTIF: "true"
          G4F: "1"
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python3 tick.py > diag_run.txt 2>&1
          echo "EXIT_CODE=$?" >> diag_run.txt
      - name: Commit diagnóstico
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag_run.txt
          git diff --cached --quiet || git commit -m "diag: captura de execução do tick"
          git push origin HEAD
