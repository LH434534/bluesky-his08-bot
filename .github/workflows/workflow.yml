name: bluesky-bot

on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Publicar post imediatamente"
        required: false
        default: "false"
        type: boolean
      force_text:
        description: "Texto do post forçado (vazio = gerar com IA)"
        required: false
        default: ""
        type: string
      ia_enabled:
        description: "Forçar geração com IA (mesmo sem texto)"
        required: false
        default: "true"
        type: boolean
      ai_test_only:
        description: "Apenas testar IA (gera conteúdo sem publicar)"
        required: false
        default: "false"
        type: boolean
      force_bio:
        description: "Atualizar a bio do perfil agora"
        required: false
        default: "false"
        type: boolean
      force_avatar:
        description: "Trocar a foto de perfil agora"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de IA
        run: pip install -U g4f --quiet || echo "sem pacote gratuito, segue fallback"

      - name: Rodar bot autônomo (anti-ban extremo)
        env:
          TZ: "America/Sao_Paulo"
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_FORCE_POST: ${{ github.event.inputs.force_post }}
          BSKY_FORCE_TEXT: ${{ github.event.inputs.force_text }}
          IA_ENABLED: ${{ github.event.inputs.ia_enabled }}
          BSKY_AI_TEST_ONLY: ${{ github.event.inputs.ai_test_only }}
          BSKY_FORCE_BIO: ${{ github.event.inputs.force_bio }}
          BSKY_FORCE_AVATAR: ${{ github.event.inputs.force_avatar }}
          G4F: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python3 tick.py
